<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101524">
  <title>Roblox User Lookup Demo</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #101524; color: #eef2ff; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: radial-gradient(ellipse at top, #263450, #101524 65%); }
    main { width: min(100%, 620px); padding: clamp(24px, 5vw, 44px); border: 1px solid #34415b; border-radius: 20px; background: #171f30; box-shadow: 0 24px 80px #05091488; }
    .eyebrow { margin: 0 0 8px; color: #8ddcff; font-size: .75rem; font-weight: 750; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(2rem, 7vw, 3rem); line-height: 1.1; }
    .intro { color: #b6c1d5; margin: 14px 0 28px; }
    label { display: block; margin-bottom: 8px; font-weight: 650; }
    .controls { display: flex; gap: 10px; }
    input { min-width: 0; flex: 1; padding: 13px 14px; border: 1px solid #46536c; border-radius: 10px; background: #0e1523; color: white; font: inherit; }
    input:focus-visible, button:focus-visible { outline: 3px solid #63d3ff; outline-offset: 2px; }
    button { padding: 0 18px; border: 0; border-radius: 10px; background: #72d6ff; color: #092133; font: inherit; font-weight: 750; cursor: pointer; }
    .status { min-height: 1.5em; margin: 16px 0; color: #bac6da; }
    .result { padding: 16px; border: 1px solid #34415b; border-radius: 12px; background: #101725; }
    .result h2 { margin: 0 0 12px; font-size: 1rem; }
    pre { margin: 0; overflow-wrap: anywhere; white-space: pre-wrap; color: #d7e4f6; }
    .footnote { margin: 22px 0 0; color: #9daac1; font-size: .82rem; }
    @media (max-width: 480px) { .controls { flex-direction: column; } button { min-height: 46px; } }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Account lookup · Demo</p>
    <h1>Roblox User Lookup</h1>
    <p class="intro">Enter a username to see a sample result. This static page works without installing anything.</p>
    <form id="lookup-form">
      <label for="username">Username</label>
      <div class="controls">
        <input id="username" maxlength="20" autocomplete="off" placeholder="e.g. Builderman" required>
        <button type="submit">Look up</button>
      </div>
    </form>
    <p id="status" class="status" role="status" aria-live="polite">Ready.</p>
    <section id="result" class="result" aria-label="Lookup result" hidden></section>
    <p class="footnote">Demo only: this static GitHub Pages version does not contact Roblox or show real account data.</p>
  </main>
  <script>
    const form = document.querySelector('#lookup-form');
    const input = document.querySelector('#username');
    const status = document.querySelector('#status');
    const result = document.querySelector('#result');
    form.addEventListener('submit', event => {
      event.preventDefault();
      const username = input.value.trim();
      if (!/^[A-Za-z0-9_]{1,20}$/.test(username)) {
        status.textContent = 'Use 1–20 letters, numbers, or underscores.';
        input.focus();
        return;
      }
      const heading = document.createElement('h2');
      heading.textContent = 'Sample result (not live Roblox data)';
      const pre = document.createElement('pre');
      pre.textContent = JSON.stringify({ mode: 'demo', user: { name: username, displayName: username } }, null, 2);
      result.replaceChildren(heading, pre);
      result.hidden = false;
      status.textContent = 'Demo result ready.';
    });
  </script>
</body>
</html>
