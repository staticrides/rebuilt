<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101524" />
    <meta name="description" content="A simple Roblox username lookup demo." />
    <title>Roblox User Lookup</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main class="page">
      <section class="card" aria-labelledby="title">
        <p class="eyebrow">Account lookup</p>
        <h1 id="title">Roblox User Lookup</h1>
        <p class="intro">Enter a username to view matching account details.</p>
        <form id="lookup-form">
          <label for="username">Username</label>
          <div class="controls">
            <input id="username" name="username" maxlength="20" autocomplete="off" placeholder="e.g. Builderman" required />
            <button type="submit">Look up</button>
          </div>
        </form>
        <p id="status" class="status" role="status" aria-live="polite">Ready.</p>
        <section id="result" class="result" aria-label="Lookup result" hidden></section>
        <p class="footnote">Without an API key, the app runs in demo mode and does not return real Roblox data.</p>
      </section>
    </main>
  </body>
</html>
